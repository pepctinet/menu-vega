<!doctype html>
<html lang="ca">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#4a7c3f">
  <title>Sense connexió · Menú Vega</title>
  <style>
    :root{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:#263026;background:#f7f4ed}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(460px,100%);background:#fff;border:1px solid #dce3d8;border-radius:18px;padding:28px;box-shadow:0 10px 35px #24302418}
    h1{font-size:24px;margin:0 0 10px} p{line-height:1.5;margin:0 0 20px;color:#596459}
    button{min-height:44px;border:0;border-radius:12px;padding:0 18px;background:#3f7137;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    button:focus-visible{outline:3px solid #f0a43a;outline-offset:3px}
  </style>
</head>
<body>
  <main>
    <h1>Sense connexió</h1>
    <p>No s'ha pogut carregar aquesta pantalla. Comprova la connexió i torna-ho a provar.</p>
    <button type="button" onclick="location.reload()">Tornar-ho a provar</button>
  </main>
</body>
</html>
