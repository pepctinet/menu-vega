<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menú Vega</title>
<link rel="icon" href="icona.svg">
<style>
:root{
  --verd:#4a7c3f; --verd-clar:#e8f0e3; --verd-fosc:#2f5226;
  --groc:#d9a219; --groc-clar:#fdf3dc;
  --vermell:#c0392b; --vermell-clar:#fbeae8;
  --sorra:#f7f4ed; --paper:#fff; --text:#2c2c28; --gris:#8a8a80;
  --linia:#e2ded2; --ombra:0 1px 3px rgba(0,0,0,.06),0 6px 18px rgba(0,0,0,.05);
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--sorra);color:var(--text);
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 font-size:15px;line-height:1.45}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px 70px}

header.top{background:var(--verd);color:#fff;padding:14px 0 0}
.top .wrap{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand h1{font-size:21px;cursor:default;user-select:none}
.brand .sub{font-size:12.5px;opacity:.82}
.weeknav{margin-left:auto;display:flex;align-items:center;gap:6px;
 background:rgba(255,255,255,.14);border-radius:99px;padding:3px}
.weeknav button{width:30px;height:30px;border-radius:99px;font-size:16px;line-height:1;color:#fff}
.weeknav button:hover{background:rgba(255,255,255,.2)}
.weeknav .lbl{padding:0 10px;font-size:13px;font-weight:600;white-space:nowrap}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tabs button{padding:10px 16px;border-radius:10px 10px 0 0;font-size:14px;
 font-weight:600;opacity:.75;white-space:nowrap;color:#fff}
.tabs button.on{background:var(--sorra);color:var(--verd-fosc);opacity:1}
.estat-sinc{font-size:11.5px;display:flex;align-items:center;gap:6px;margin-left:12px;
 color:#fff;background:rgba(255,255,255,.13);border-radius:99px;padding:3px 11px}
.estat-sinc:hover{background:rgba(255,255,255,.24)}
.estat-sinc .p{width:8px;height:8px;border-radius:99px;background:#5fd35f;flex:none;
 box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.estat-sinc .p.off{background:#ff6b5e}
.estat-sinc .p.err{background:#ffc043}

/* ---------- porta d'entrada ---------- */
.porta{position:fixed;inset:0;background:var(--sorra);z-index:200;display:flex;
 align-items:center;justify-content:center;padding:24px}
.porta .box{background:#fff;border:1px solid var(--linia);border-radius:18px;
 box-shadow:0 20px 60px rgba(0,0,0,.10);width:100%;max-width:390px;padding:28px 26px}
.porta h2{font-size:21px;margin-bottom:3px}
.porta .s{font-size:13px;color:var(--gris);margin-bottom:20px}
.porta input{width:100%;padding:12px 14px;border:1px solid var(--linia);border-radius:11px;
 font-size:15px;background:#fdfdfb;margin-bottom:10px}
.porta input:focus{outline:2px solid var(--verd-clar);border-color:var(--verd)}
.porta .err{color:var(--vermell);font-size:13px;min-height:19px;margin-top:4px}
.porta .peu{font-size:12px;color:var(--gris);margin-top:16px;line-height:1.5}
.badge{background:var(--vermell);color:#fff;border-radius:99px;font-size:10px;
 padding:1px 6px;font-weight:800;margin-left:5px;vertical-align:1px}

/* ---------- taulell de missatges ---------- */
.msg{border:1px solid var(--linia);border-radius:13px;padding:13px 15px;margin-bottom:9px;
 background:#fff}
.msg.meu{background:var(--verd-clar);border-color:#cfe0c5}
.msg.nou{border-color:var(--verd);box-shadow:0 0 0 2px var(--verd-clar)}
.msg .cap{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
 margin-bottom:6px}
.msg .qui{font-weight:700;font-size:13.5px}
.msg .quan{font-size:11.5px;color:var(--gris);white-space:nowrap}
.msg .txt{font-size:14.5px;white-space:pre-wrap;line-height:1.5}
.msg .peu{font-size:11.5px;color:var(--gris);margin-top:8px;display:flex;
 justify-content:space-between;gap:10px;align-items:center}
textarea.msgbox{width:100%;padding:12px 14px;border:1px solid var(--linia);border-radius:12px;
 font-size:14.5px;background:#fdfdfb;min-height:90px;resize:vertical;font-family:inherit}

/* ---------- pes ---------- */
.pesgraf{width:100%;height:230px;display:block}
.pesgraf .eix{stroke:#e2ded2;stroke-width:1}
.pesgraf .tend{fill:none;stroke:var(--verd);stroke-width:2.5;stroke-linejoin:round;
 stroke-linecap:round}
.pesgraf .punt{fill:#c9c5b6}
.pesgraf text{font-size:10px;fill:#8a8a80}

.card{background:var(--paper);border:1px solid var(--linia);border-radius:var(--r);
 box-shadow:var(--ombra)}
.pad{padding:16px}
.muted{color:var(--gris)} .small{font-size:12.5px} .xs{font-size:11.5px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between}
.btn{background:var(--verd);color:#fff;padding:8px 14px;border-radius:9px;
 font-size:13.5px;font-weight:600}
.btn:hover{background:var(--verd-fosc)}
.btn.ghost{background:#fff;color:var(--verd-fosc);border:1px solid var(--linia)}
.btn.ghost:hover{background:var(--verd-clar)}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.danger{background:#fff;color:var(--vermell);border:1px solid #f0d5d1}
.btn:disabled{opacity:.45;cursor:not-allowed}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;
 font-weight:600;background:var(--verd-clar);color:var(--verd-fosc)}
.tag.blau{background:#e6eef5;color:#3a5a75}
.tag.groc{background:var(--groc-clar);color:#8a6410}
/* Avís dels canvis que la reprogramació en cadena ha fet sola */
.avis{background:var(--groc-clar);border:1px solid #eddcae;border-radius:10px;
 padding:11px 13px;margin-bottom:12px}
.avis h3{font-size:14px;color:#8a6410;margin-bottom:5px}
.avis .lin{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
 padding:4px 0;border-top:1px solid #eddcae}
.avis .lin:first-of-type{border-top:0}
.sec-title{margin:22px 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.sec-title h2{font-size:17px}

.dot{width:11px;height:11px;border-radius:99px;display:inline-block;flex:none}
.dot.v{background:#57a247}.dot.g{background:var(--groc)}.dot.r{background:var(--vermell)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:99px;
 font-size:11.5px;font-weight:700}
.pill.v{background:var(--verd-clar);color:var(--verd-fosc)}
.pill.g{background:var(--groc-clar);color:#8a6410}
.pill.r{background:var(--vermell-clar);color:var(--vermell)}
.eq{display:inline-flex;align-items:center;gap:5px;background:var(--verd-clar);
 color:var(--verd-fosc);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:700}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:14px}
@media(max-width:1000px){.week{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.week{grid-template-columns:1fr}}
.day{background:var(--paper);border:1px solid var(--linia);border-radius:var(--r);
 overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--ombra)}
.day.today{border-color:var(--verd);box-shadow:0 0 0 3px var(--verd-clar),var(--ombra)}
.day.past .dhead{background:#f0ede4}
.day.val{border-color:#9ec78e}
.dhead{padding:9px 11px;background:var(--verd-clar);border-bottom:1px solid var(--linia)}
.dhead .dn{font-size:13.5px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;
 color:var(--verd-fosc)}
.dhead .dd{font-size:11px;color:var(--gris)}
.day.today .dhead{background:var(--verd)}
.day.today .dn{color:#fff}.day.today .dd{color:#fff;opacity:.85}
.dbody{padding:8px;display:flex;flex-direction:column;gap:6px;flex:1}
.slot{border:1px solid var(--linia);border-radius:10px;padding:7px 8px;background:#fdfdfb}
.slot .lbl{font-size:9.5px;font-weight:800;letter-spacing:.07em;color:var(--gris);
 text-transform:uppercase}
.slot .nm{font-size:12.5px;font-weight:600;margin-top:2px;line-height:1.3}
.slot .nm.empty{color:#b9b6ab;font-weight:500;font-style:italic}
.slot:hover{border-color:var(--verd);background:var(--verd-clar);cursor:pointer}
.slot.block:hover{border-color:var(--linia);background:#fdfdfb;cursor:default}
.dfoot{padding:8px 11px;border-top:1px solid var(--linia);background:#fbfaf6;
 display:flex;flex-direction:column;gap:5px}
.kbar{height:5px;border-radius:99px;background:#eceadf;overflow:hidden}
.kbar span{display:block;height:100%;background:var(--verd)}
.mini-foto{width:15px;height:15px;border-radius:3px;object-fit:cover;flex:none}

.ov{position:fixed;inset:0;background:rgba(30,30,26,.45);display:none;
 align-items:flex-start;justify-content:center;padding:24px 14px;z-index:50;overflow:auto}
.ov.on{display:flex}
.modal{background:var(--paper);border-radius:16px;width:100%;max-width:760px;
 box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal.narrow{max-width:420px}
.mhead{padding:16px 18px;border-bottom:1px solid var(--linia);display:flex;
 justify-content:space-between;align-items:center;position:sticky;top:0;background:#fff;
 border-radius:16px 16px 0 0;z-index:2}
.mbody{padding:16px 18px}
.close{font-size:22px;color:var(--gris);line-height:1}

.dishlist{display:flex;flex-direction:column;gap:7px;max-height:52vh;overflow:auto;
 padding-right:4px}
.dish{border:1px solid var(--linia);border-radius:11px;padding:10px 12px;
 display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#fff}
.dish:hover{border-color:var(--verd);background:var(--verd-clar)}
.dish.sel{border-color:var(--verd);background:var(--verd-clar)}
.dish .info{flex:1;min-width:0}
.dish .t{font-weight:700;font-size:14px}
.dish .ing{font-size:11.5px;color:var(--gris);margin-top:3px;line-height:1.4}
.dish .mac{font-size:11px;color:var(--verd-fosc);margin-top:4px;font-weight:600}
.search{width:100%;padding:9px 12px;border:1px solid var(--linia);border-radius:10px;
 margin-bottom:10px;background:#fdfdfb}
.search:focus{outline:2px solid var(--verd-clar);border-color:var(--verd)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
 color:var(--gris);padding:8px 10px;border-bottom:1px solid var(--linia)}
td{padding:8px 10px;border-bottom:1px solid #f2f0e8;vertical-align:middle}
tr:last-child td{border-bottom:none}
.qty{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}

.cfg{display:grid;grid-template-columns:1.15fr 1fr;gap:16px;margin-top:14px;
 align-items:start}
@media(max-width:840px){.cfg{grid-template-columns:1fr}}
.grp{margin-bottom:16px}
.grp h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--gris);
 margin-bottom:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--linia);border-radius:99px;padding:5px 11px;font-size:12.5px;
 background:#fff}
.chip:hover{border-color:var(--verd);background:var(--verd-clar)}
.chip.on{background:var(--verd);color:#fff;border-color:var(--verd)}
.chip.nou{border-style:dashed;color:var(--verd-fosc);font-weight:600}
.qrow{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #f2f0e8}
.qrow:last-child{border-bottom:none}
.qrow .nm{flex:1;font-size:13.5px}
.qrow input[type=number]{width:78px;padding:5px 7px;border:1px solid var(--linia);
 border-radius:8px;text-align:right;font-variant-numeric:tabular-nums}
.qrow .un{font-size:11.5px;color:var(--gris);width:34px}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.macro div{background:var(--verd-clar);border-radius:10px;padding:9px;text-align:center}
.macro .v{font-size:17px;font-weight:800;color:var(--verd-fosc);font-variant-numeric:tabular-nums}
.macro .l{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--gris)}
.checks{display:flex;flex-direction:column;gap:5px;font-size:12.5px}
.checks div{display:flex;gap:7px;align-items:flex-start}
.ok{color:#57a247;font-weight:800}.no{color:var(--vermell);font-weight:800}

.inds{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.ind{display:flex;gap:7px;align-items:center;border:1px solid var(--linia);
 border-radius:99px;padding:5px 12px;font-size:12.5px;background:#fff}
.ind.on{background:var(--verd-clar);border-color:var(--verd);color:var(--verd-fosc);font-weight:600}
.hw-head{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;
 cursor:pointer;background:#fff;border:1px solid var(--linia);border-radius:12px}
.hw-head:hover{background:var(--verd-clar)}
.hist-week{margin-bottom:10px}
.galeria{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gfoto{border:1px solid var(--linia);border-radius:11px;overflow:hidden;background:#fff}
.gfoto img{width:100%;height:118px;object-fit:cover;display:block;cursor:zoom-in}
.gfoto .c{padding:6px 8px;font-size:11px;color:var(--gris)}
.gfoto .c b{color:var(--text);display:block;font-size:12px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;
 justify-content:center;z-index:60;padding:24px}
.zoom.on{display:flex}
.zoom img{max-width:100%;max-height:100%;border-radius:10px}
.zoom .caixa{display:flex;flex-direction:column;align-items:center;gap:14px;max-height:100%}
.zoom .tancar{background:#fff;color:var(--text);border-radius:11px;padding:11px 22px;
 font-weight:700;font-size:14.5px}
.zoom .creu{position:fixed;top:18px;right:22px;background:rgba(255,255,255,.92);
 color:var(--text);width:42px;height:42px;border-radius:99px;font-size:22px;line-height:1}
/* la sensació d'ella és un quadrat, per distingir-la de la resta de marques */
.quad{width:11px;height:11px;display:inline-block;flex:none;border-radius:2px}
/* nivell d'acompanyament: mateix color, tres ompliments. Escala neutra */
.sup{width:12px;height:12px;border-radius:99px;border:2px solid #5b6b7a;
 display:inline-block;flex:none;vertical-align:-2px}
.sup.ple{background:#5b6b7a}
.sup.mig{background:linear-gradient(90deg,#5b6b7a 50%,transparent 50%)}
.sup.buit{background:transparent}
.foto-marca{background:none;padding:0 2px;font-size:12px;color:var(--gris);line-height:1}
.foto-marca:hover{color:var(--verd-fosc)}
.no-print{}
@media print{
  header.top,.tabs,.no-print{display:none!important}
  body{background:#fff}.card{box-shadow:none;border-color:#ccc}
  .week{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1 id="titol">Menú Vega</h1>
        <div class="sub row">
          <span>Seguiment de les indicacions</span>
          <button class="estat-sinc" id="estatSinc" title="Clica per iniciar o tancar la sessió">
            <span class="p off"></span><span id="estatTxt">…</span></button>
        </div>
      </div>
      <div class="weeknav">
        <button id="wprev" title="Setmana anterior">‹</button>
        <span class="lbl" id="wlbl">—</span>
        <button id="wnext" title="Setmana següent">›</button>
        <button id="wtoday" style="width:auto;padding:0 11px;font-size:12px">avui</button>
      </div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </div>
</header>

<main class="wrap" id="view"></main>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="zoom" id="zoom">
  <button class="creu" onclick="tancarZoom()" title="Tancar">×</button>
  <div class="caixa">
    <img id="zoomImg" alt="">
    <button class="tancar" onclick="tancarZoom()">Tancar la fotografia</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script src="core.js"></script>
<script src="nutri.js"></script>
<script src="sync.js"></script>
<script>
/* =====================================================================
   APLICATIU D'ORDINADOR
   ---------------------------------------------------------------------
   Dos modes:
   · TANCAT (per defecte) — es veu exactament el mateix que al mòbil:
     plats, quantitats i l'etiqueta "Equilibrat". Cap número.
   · OBERT — amb la contrasenya es veuen calories, macronutrients,
     semàfor, objectius, mitjanes i les fotografies del registre.
   ===================================================================== */

/* Empremta SHA-256 de la contrasenya. Al codi no hi ha el text de la
   contrasenya: només aquesta empremta, de la qual no es pot recuperar.
   Per canviar-la, calcula l'SHA-256 de la nova i substitueix-la aquí. */
let cursor = monday(TODAY);
let tab = "setmana";

/* ---------------------------------------------------------------------
   PORTA D'ENTRADA
   L'aplicatiu no ensenya res fins que algú ha iniciat la sessió amb el
   seu compte. No hi ha cap contrasenya compartida: qui ets determina
   què veus, i queda apuntat qui canvia què.

   Si no hi ha connexió amb el servidor (o el fitxer s'obre en local per
   fer proves) l'aplicatiu funciona igual amb les dades d'aquest aparell,
   avisant-ne. Això vol dir que la porta ordena, però no és una caixa
   forta: qui tingui l'ordinador i el desconnecti hi pot entrar.
   --------------------------------------------------------------------- */
function sessioIniciada(){ return Sync.est.estat === "connectat"; }
function modeLocal(){ return !Sync.configurat() || Sync.est.estat === "error"; }
/* "obert" vol dir: es poden veure els números i tot el seguiment */
function estaObert(){ return sessioIniciada() || modeLocal(); }
Object.defineProperty(window, "obert", {get: estaObert});

function pintarPorta(){
  const cal = Sync.configurat() && !sessioIniciada() && Sync.est.estat!=="error"
              && Sync.est.estat!=="carregant";
  let p = document.getElementById("porta");
  if(!cal){ if(p) p.remove(); return; }
  if(p) return;
  p = document.createElement("div");
  p.className = "porta"; p.id = "porta";
  p.innerHTML = `<div class="box">
      <h2>Seguiment Mar</h2>
      <div class="s">Inicia la sessió amb el teu compte</div>
      <input id="poEmail" type="email" placeholder="Usuari" autocomplete="username">
      <input id="poPass" type="password" placeholder="Contrasenya" autocomplete="current-password">
      <div class="err" id="poErr"></div>
      <button class="btn" style="width:100%;padding:12px" onclick="entrarPorta()">Entrar</button>
      <div class="peu">Cada persona entra amb el seu compte: tu, la nutricionista
        i la psicòloga. Queda registrat qui modifica el pla.</div>
    </div>`;
  document.body.appendChild(p);
  const em = document.getElementById("poEmail");
  const pw = document.getElementById("poPass");
  const anar = e => { if(e.key==="Enter") entrarPorta(); };
  em.addEventListener("keydown", anar); pw.addEventListener("keydown", anar);
  setTimeout(()=>em.focus(), 60);
}
async function entrarPorta(){
  const err = document.getElementById("poErr");
  err.textContent = "";
  try{
    await Sync.login(document.getElementById("poEmail").value.trim(),
                     document.getElementById("poPass").value);
  }catch(e){
    err.textContent = /password|credential|user-not-found|invalid/i.test(e.code||e.message)
      ? "L'usuari o la contrasenya no són correctes."
      : "No s'ha pogut entrar. Comprova la connexió.";
  }
}
$("#estatSinc").addEventListener("click", ()=>{
  if(sessioIniciada()){
    if(confirm("Vols tancar la sessió?")) Sync.logout();
  } else if(Sync.configurat()){
    pintarPorta();
  } else {
    alert("Aquest aparell encara no està connectat al servidor.");
  }
});

/* ---------------------------------------------------------------------
   PRESENTACIÓ
   --------------------------------------------------------------------- */
function macroBox(t){
  return `<div class="macro">
    <div><div class="v">${Math.round(t.kcal)}</div><div class="l">kcal</div></div>
    <div><div class="v">${Math.round(t.p)}</div><div class="l">proteïna g</div></div>
    <div><div class="v">${Math.round(t.c)}</div><div class="l">hidrats g</div></div>
    <div><div class="v">${Math.round(t.f)}</div><div class="l">greix g</div></div>
  </div>`;
}
function checksBox(C){
  return `<div class="checks">`+C.map(c=>
    `<div><span class="${c.ok?'ok':'no'}">${c.ok?'✓':'✕'}</span><span>${esc(c.t)}${
      c.v!==""&&c.v!=null?` <span class="muted">— ${esc(String(c.v))}</span>`:""}</span></div>`
  ).join("")+`</div>`;
}
function faltenBox(falten){
  if(!falten.length) return "";
  return `<div class="small muted" style="margin-top:8px">Hi pots afegir: `+
    falten.map(esc).join(" · ")+`</div>`;
}
const LVLTXT = {v:"Òptim", g:"Millorable", r:"Insuficient"};
const OBJECTE_DIA = ds => dayData(ds);

/* =====================================================================
   VISTA: SETMANA
   ===================================================================== */
/* Llegenda de les marques. És la mateixa funció a la setmana i al
   registre: si les figures volen dir el mateix als dos llocs, la
   llegenda també ha de ser la mateixa.
     · cercle ple  → com ha quedat l'àpat o el dia
     · cercle amb vora → acompanyament (el marca el pare)
     · quadrat     → com s'hi ha sentit (ho escriu només ella)
   El cercle i el quadrat es distingeixen per la forma i no només pel
   color, que és el que els fa llegibles d'un cop d'ull. */
function llegendaMarques(o){
  const p = [];
  if(o.dots){
    const nivells = obert ? ["v","g","r"].map(l=>[l, LVLTXT[l].toLowerCase()])
                          : [["v","equilibrat"]];
    p.push(`<span class="row" style="gap:5px">Àpat i dia:
      ${nivells.map(([l,n])=>`<span class="row" style="gap:4px"><span class="dot ${l}"></span>
        <span class="xs">${esc(n)}</span></span>`).join("")}</span>`);
  }
  if(o.sup) p.push(`<span class="row" style="gap:5px">Acompanyament:
    ${SUPERVISIO.map(x=>`<span class="row" style="gap:4px"><span class="sup ${x.omplert}"></span>
      <span class="xs">${esc(x.curt)}</span></span>`).join("")}</span>`);
  if(o.sens) p.push(`<span class="row" style="gap:5px">Com s'hi ha sentit:
    ${SENSACIONS.map(x=>`<span class="row" style="gap:4px">
      <span class="quad" style="background:${x.color}"></span>
      <span class="xs">${esc(x.n.toLowerCase())}</span></span>`).join("")}</span>`);
  return `<div class="small muted" style="margin-bottom:8px;display:flex;gap:18px;flex-wrap:wrap">
    ${p.join("")}</div>`;
}

function viewSetmana(){
  const seg = weekKey(cursor)===weekKey(addDays(TODAY,7));
  let html = `<div class="sec-title"><h2>Planificació setmanal</h2>
    <span class="muted small">Clica un àpat per triar-lo o canviar-lo</span>
    <span style="margin-left:auto" class="no-print">
      <button class="btn ghost sm" onclick="proposar()">Proposar aquesta setmana</button>
      <button class="btn ghost sm" onclick="programarSeguent()">Programar la setmana següent</button>
      <button class="btn ghost sm" onclick="copiarSetmana()">Copiar l'anterior</button>
      <button class="btn ghost sm" onclick="buidarSetmana()">Buidar</button>
    </span></div>`;
  if(seg) html += `<div class="small muted" style="margin-bottom:6px">Estàs veient la setmana vinent.</div>`;
  html += avisAutomatics();
  html += llegendaMarques({dots:true, sup:true, sens:true});
  html += `<div class="week">`;

  for(let i=0;i<7;i++){
    const dt = addDays(cursor,i), ds = iso(dt), day = dayData(ds);
    const avui = ds===iso(TODAY), passat = dt<TODAY, val = esValidat(day);
    const chk = checkDay(day);
    const sc  = obert ? scoreDayFull(day) : null;
    const teMenu = chk.fets>0;
    html += `<div class="day${avui?" today":""}${passat?" past":""}${val?" val":""}">
      <div class="dhead"><div class="spread">
        <div><div class="dn">${DIES[i]}</div>
        <div class="dd">${fmtDay(dt)}${val?" · validat":avui?" · avui":passat?" · passat":""}</div></div>
        ${teMenu ? (obert ? `<span class="dot ${sc.lvl}" title="${LVLTXT[sc.lvl]}"></span>`
                          : (chk.complet?`<span class="dot v" title="Equilibrat"></span>`:"")) : ""}
      </div></div><div class="dbody">`;
    for(const m of MEALS){
      const a = apatDelDia(day, m.id);
      const d = (a && a.tipus==="plat") ? dishById(a.id) : null;
      const c = (a && a.valorable) ? faltaApat(a.i, m.id) : null;
      const ms = (obert && d) ? scoreMealFull(d.id, m.id) : null;
      const foto = day.fotos && day.fotos[m.id];
      const sens = day.sensacio && day.sensacio[m.id];
      const sd = sens ? SENSACIONS.find(x=>x.id===sens) : null;
      const sup = supervisioDe(day, m.id);
      const sx = sup ? SUPERVISIO.find(x=>x.id===sup) : null;
      html += `<div class="slot${val?" block":""}" ${val?"":`onclick="obrirTria('${ds}','${m.id}')"`}>
        <div class="row" style="justify-content:space-between">
          <span class="row" style="gap:5px">
            ${sx?`<span class="sup ${sx.omplert}" title="${esc(sx.n)}"></span>`:""}
            <span class="lbl">${m.n} · ${m.h}</span>
          </span>
          <span class="row" style="gap:4px">
            ${sd?`<span class="quad" style="background:${sd.color}" title="S'hi ha sentit ${esc(sd.n.toLowerCase())}"></span>`:""}
            ${foto&&obert?`<button class="foto-marca" title="Veure la fotografia"
               onclick="event.stopPropagation();veureFoto('${ds}','${m.id}')">◉</button>`:""}
            ${ms?`<span class="dot ${ms.lvl}"></span>`
                :(c&&c.complet?`<span class="dot v"></span>`:"")}
          </span>
        </div>
        <div class="nm ${a?"":"empty"}">${a?esc(a.n):"— triar —"}</div>
        ${a && a.tipus!=="plat" ? `<div class="xs" style="margin-top:2px">
            <span class="tag ${a.tipus==="fora"?"blau":""}">${a.tipus==="fora"?"fora de casa":"adaptat per ella"}</span></div>` : ""}
        ${a && a.tipus!=="fora" ? `<div class="xs muted" style="margin-top:3px">${esc(ingListShort(a.i,3))}</div>` : ""}
        ${(day.auto && day.auto[m.id]) ? `<div class="xs" style="margin-top:2px">
            <span class="tag groc">canviat sol</span></div>` : ""}
      </div>`;
      if(m.id==="dinar"||m.id==="sopar"){
        const p = dishById(day.postres[m.id]);
        html += `<div class="xs" style="margin:-3px 0 1px 8px;color:#9a978c;${val?"":"cursor:pointer"}"
          ${val?"":`onclick="obrirPostres('${ds}','${m.id}')"`}>
          ↳ postres: <b style="color:var(--verd-fosc)">${p?esc(p.n):"triar"}</b></div>`;
      }
    }
    html += `</div><div class="dfoot">`;
    if(obert && teMenu){
      html += `<div class="spread xs"><span class="muted">${Math.round(sc.kcal)} kcal · ${Math.round(sc.prot)} g proteïna</span>
        <span class="muted">${chk.fets}/5</span></div>
        <div class="kbar"><span style="width:${Math.min(100,sc.kcal/targetActual().kcal*100)}%"></span></div>`;
    } else if(teMenu){
      html += `<div class="spread xs"><span class="muted">${chk.fets} de 5 àpats</span>
        ${chk.complet?`<span class="eq">Equilibrat</span>`:""}</div>`;
    }
    html += `<div class="row no-print" style="gap:5px;margin-top:3px">
        <button class="btn ghost sm" style="flex:1" onclick="obrirDia('${ds}')">Detall</button>
        ${obert ? (val
          ? `<button class="btn ghost sm" onclick="desvalidar('${ds}')" title="Reobrir el dia">↺</button>`
          : (teMenu?`<button class="btn sm" onclick="validar('${ds}')" title="Tancar el dia i desar-lo al registre">Validar</button>`:"")
        ) : ""}
      </div></div></div>`;
  }
  html += `</div>`;

  if(obert){
    const tot = {kcal:0,p:0,c:0,f:0}; let n=0;
    for(let i=0;i<7;i++){
      const day = dayData(iso(addDays(cursor,i)));
      if(!Object.keys(day.meals).length) continue;
      const sc = scoreDayFull(day);
      n++; tot.kcal+=sc.t.kcal; tot.p+=sc.t.p; tot.c+=sc.t.c; tot.f+=sc.t.f;
    }
    if(n){
      html += `<div class="sec-title"><h2>Mitjana de la setmana</h2>
        <span class="muted small">${n} dia${n>1?"s":""} amb menú · només visible amb accés</span></div>
        <div class="card pad">${macroBox({kcal:tot.kcal/n,p:tot.p/n,c:tot.c/n,f:tot.f/n})}
        <div class="small muted">Objectiu diari: ${targetActual().kcal} kcal ·
        ${targetActual().prot} g de proteïna · ${targetActual().verd} g de verdura ·
        ${targetActual().fruita} racions de fruita.
        <button class="btn ghost sm no-print" style="margin-left:8px" onclick="editarObjectius()">Canviar</button></div></div>`;
    }
  }
  return html;
}

/* =====================================================================
   MODALS
   ===================================================================== */
function openModal(html, narrow){
  $("#modal").className = "modal"+(narrow?" narrow":"");
  $("#modal").innerHTML = html;
  $("#ov").classList.add("on");
}
function closeModal(){ $("#ov").classList.remove("on"); }
$("#ov").addEventListener("click", e=>{ if(e.target.id==="ov") closeModal(); });
function obrirZoom(url){ $("#zoomImg").src = url; $("#zoom").classList.add("on"); }
function tancarZoom(){ $("#zoom").classList.remove("on"); }
$("#zoom").addEventListener("click", e=>{ if(e.target.id==="zoom") tancarZoom(); });
document.addEventListener("keydown", e=>{
  if(e.key!=="Escape") return;
  if($("#zoom").classList.contains("on")) tancarZoom();
  else closeModal();
});

let triaCtx = null;
function obrirTria(ds, mealId){
  triaCtx = {ds, mealId};
  const m = MEALS.find(x=>x.id===mealId);
  openModal(`<div class="mhead">
    <div><h3>${m.n} · ${m.h}</h3><div class="small muted">${esc(fmtLong(parseDay(ds)))}</div></div>
    <button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody">
      <input class="search" id="q" placeholder="Cercar plat o ingredient…" oninput="pintarTria()">
      <div id="llista"></div>
      <div class="row" style="margin-top:12px;justify-content:space-between">
        <button class="btn ghost sm" onclick="treureApat()">Treure aquest àpat</button>
        <button class="btn sm" onclick="closeModal();cfgFrom(null)">Crear un plat nou</button>
      </div>
    </div>`);
  pintarTria();
  setTimeout(()=>{ const q=$("#q"); if(q) q.focus(); }, 40);
}
function pintarTria(){
  const q = ($("#q").value||"").toLowerCase().trim();
  const cur = dayData(triaCtx.ds).meals[triaCtx.mealId];
  let list = DISHES().filter(d=>d.m.includes(triaCtx.mealId));
  if(q) list = list.filter(d=>d.n.toLowerCase().includes(q) ||
      Object.keys(d.i).some(k=>ing(k) && ing(k).n.toLowerCase().includes(q)));
  $("#llista").innerHTML = `<div class="dishlist">`+(list.length?list.map(d=>{
    const c  = checkMeal(d.id, triaCtx.mealId);
    const ms = obert ? scoreMealFull(d.id, triaCtx.mealId) : null;
    return `<div class="dish ${cur===d.id?"sel":""}" onclick="triar('${d.id}')">
      ${ms?`<span class="dot ${ms.lvl}" style="margin-top:6px"></span>`
          :(c.complet?`<span class="dot v" style="margin-top:6px"></span>`
                     :`<span class="dot" style="margin-top:6px;background:#e0ddd2"></span>`)}
      <div class="info">
        <div class="t">${esc(d.n)} ${d.src?`<span class="tag">${esc(d.src)}</span>`:""}</div>
        <div class="ing">${esc(ingList(d.i))}</div>
        ${obert?`<div class="mac">${Math.round(ms.t.kcal)} kcal · ${Math.round(ms.t.p)} g P · ${Math.round(ms.t.c)} g HC · ${Math.round(ms.t.f)} g G</div>`
               :(c.complet?`<div class="mac">Equilibrat</div>`:"")}
      </div>
      <button class="btn ghost sm" onclick="event.stopPropagation();closeModal();cfgFrom('${d.id}')">editar</button>
    </div>`;}).join("") : `<div class="muted pad">Cap plat amb aquest nom.</div>`)+`</div>`;
}
function triar(id){
  const ds = triaCtx.ds, mealId = triaCtx.mealId;
  const d = dayData(ds);
  d.meals[mealId] = id;
  if((mealId==="dinar"||mealId==="sopar") && !d.postres[mealId]){
    const altre = mealId==="dinar" ? "sopar":"dinar";
    d.postres[mealId] = d.postres[altre]==="p_iogurt" ? "p_fruita_poma" : "p_iogurt";
  }
  /* Des de l'ordinador no es mou res sol: mentre ell planifica, l'aplicatiu
     no li ha de tocar dies que acaba de posar. Només se li suggereix. */
  const sug = reprogramarCadena(ds, mealId, {aplicar:false});
  tocarDia(ds); closeModal(); render();
  if(sug.canvis.length) suggerirCadena(ds, mealId, sug);
}
function treureApat(){
  const d = dayData(triaCtx.ds); delete d.meals[triaCtx.mealId];
  tocarDia(triaCtx.ds); closeModal(); render();
}

/* =====================================================================
   REPROGRAMACIÓ EN CADENA · suggeriment, avís i desfer
   ---------------------------------------------------------------------
   Tot això viu només aquí. L'aplicatiu d'ella fa el canvi i no en diu
   res; el que en queda escrit (day.auto) no el llegeix cap pantalla
   seva. Aquesta és la pantalla on es veu i es pot desfer.
   ===================================================================== */
const nomApat = id => (MEALS.find(m=>m.id===id)||{n:id}).n;
const nomPlat = id => { const d = dishById(id); return d ? d.n : "res"; };
const diaCurt = ds => DIES[(parseDay(ds).getDay()+6)%7]+" "+fmtDay(parseDay(ds));

function suggerirCadena(ds, mealId, sug){
  const linies = sug.canvis.map(c =>
    `<div class="lin"><b>${esc(diaCurt(c.ds))} · ${esc(nomApat(c.mealId).toLowerCase())}</b>
      <span class="small muted">${esc(nomPlat(c.abans))} → ${esc(nomPlat(c.ara))}
      · ${esc(c.motiu)}</span></div>`).join("");
  const quins = [...new Set(sug.canvis.filter(c=>c.motiu.startsWith("repetia"))
    .map(c=>c.motiu.replace("repetia ","")))].join(" i ");
  openModal(`<div class="mhead"><h3>Es repeteix ${esc(quins||"un ingredient")}</h3>
    <button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody">
      <div class="small muted" style="margin-bottom:10px">
        Els àpats principals següents porten el mateix que acabes de posar.
        Vols que ho canviï? Si dius que no, no es tocarà res.</div>
      <div class="avis">${linies}</div>
      <div class="row" style="gap:8px;margin-top:12px">
        <button class="btn" onclick="aplicarCadena('${ds}','${mealId}')">Sí, canvia-ho</button>
        <button class="btn ghost" onclick="closeModal()">No, deixa-ho com està</button>
      </div>
    </div>`, true);
}
function aplicarCadena(ds, mealId){
  const r = reprogramarCadena(ds, mealId, {aplicar:true});
  /* tocarDia només empeny la setmana del dia que rep, i la cadena pot
     travessar el cap de setmana: cal tocar cada dia mogut. */
  for(const d of r.dies) tocarDia(d);
  closeModal(); render();
}

/* Avís de dalt de la setmana: què s'ha canviat sol i botó per desfer-ho.
   Els canvis que arriben del mòbil surten aquí. */
function avisAutomatics(){
  const pend = autosSetmana(cursor);
  const seg  = autosSetmana(addDays(cursor,7)).length;
  if(!pend.length && !seg) return "";
  let h = "";
  if(pend.length){
    h += `<div class="avis"><h3>S'han reprogramat ${pend.length}
      àpat${pend.length>1?"s":""} sols</h3>
      <div class="small muted" style="margin-bottom:6px">
        Perquè no es repetissin la proteïna o l'hidrat d'un àpat que va canviar ella.
        Ella no ho ha vist: només veu el dia en curs.</div>`;
    for(const a of pend){
      h += `<div class="lin">
        <b>${esc(diaCurt(a.ds))} · ${esc(nomApat(a.mealId).toLowerCase())}</b>
        <span class="small muted">ara hi ha ${esc(nomPlat(dayData(a.ds).meals[a.mealId]))}
          · abans ${esc(nomPlat(a.abans))} · ${esc(a.motiu)}</span>
        <button class="btn ghost sm no-print" style="margin-left:auto"
          onclick="desferCanviAuto('${a.ds}','${a.mealId}')">Desfer</button></div>`;
    }
    h += `<div class="row no-print" style="margin-top:8px;gap:8px">
      <button class="btn ghost sm" onclick="desferTotsAuto()">Desfer-ho tot</button>
      <button class="btn ghost sm" onclick="acceptarTotsAuto()">D'acord, treu l'avís</button>
    </div></div>`;
  }
  if(seg) h += `<div class="small muted" style="margin-bottom:10px">
    Hi ha ${seg} canvi${seg>1?"s":""} automàtic${seg>1?"s":""} més la setmana vinent.</div>`;
  return h;
}
function desferCanviAuto(ds, mealId){
  if(desferAuto(ds, mealId)) tocarDia(ds);
  render();
}
function desferTotsAuto(){
  if(!confirm("Vols tornar tots aquests àpats al que hi havia abans?")) return;
  for(const a of autosSetmana(cursor)) if(desferAuto(a.ds, a.mealId)) tocarDia(a.ds);
  render();
}
/* Donar-los per bons: es queda el canvi i s'esborra la marca, que és el
   que fa desaparèixer l'avís. */
function acceptarTotsAuto(){
  for(const a of autosSetmana(cursor)){
    const day = dayData(a.ds);
    if(day.auto){ delete day.auto[a.mealId];
      if(!Object.keys(day.auto).length) delete day.auto; }
    tocarDia(a.ds);
  }
  render();
}
function obrirPostres(ds, meal){
  const cur = dayData(ds).postres[meal];
  openModal(`<div class="mhead"><div><h3>Postres del ${meal}</h3>
    <div class="small muted">Indicació: alternar iogurt i fruita entre el dinar i el sopar</div></div>
    <button class="close" onclick="closeModal()">×</button></div>
    <div class="mbody"><div class="dishlist">`+
    POSTRES.map(p=>`<div class="dish ${cur===p.id?"sel":""}"
      onclick="triarPostres('${ds}','${meal}','${p.id}')">
      <div class="info"><div class="t">${esc(p.n)}</div>
      <div class="ing">${esc(ingList(p.i))}</div></div></div>`).join("")+
    `</div><button class="btn ghost sm" style="margin-top:10px"
      onclick="triarPostres('${ds}','${meal}','')">Sense postres</button></div>`);
}
function triarPostres(ds, meal, id){
  const d = dayData(ds);
  if(id) d.postres[meal]=id; else delete d.postres[meal];
  tocarDia(ds); closeModal(); render();
}

/* --- detall d'un dia --- */
function obrirDia(ds){
  const day = dayData(ds), chk = checkDay(day);
  const sc  = obert ? scoreDayFull(day) : null;
  let h = `<div class="mhead"><div><h3>${esc(fmtLong(parseDay(ds)))}</h3>
    <div class="small" style="margin-top:3px">`;
  if(obert) h += `<span class="pill ${sc.lvl}"><span class="dot ${sc.lvl}"></span>${LVLTXT[sc.lvl]}</span>`;
  else if(chk.complet) h += `<span class="eq">Equilibrat</span>`;
  if(esValidat(day)) h += ` <span class="tag blau">validat el ${new Date(day.validat).toLocaleDateString("ca-ES")}</span>`;
  h += `</div></div><button class="close" onclick="closeModal()">×</button></div><div class="mbody">`;

  if(obert) h += macroBox(sc.t) + checksBox(sc.checks);
  else if(chk.falten.length) h += faltenBox(chk.falten);

  h += `<div class="sec-title"><h2 style="font-size:15px">Àpats</h2></div><table>`;
  for(const m of MEALS){
    const a = apatDelDia(day, m.id);
    const d = (a && a.tipus==="plat") ? dishById(a.id) : null;
    const c = (a && a.valorable) ? faltaApat(a.i, m.id) : null;
    const ms = (obert&&d) ? scoreMealFull(d.id,m.id) : null;
    const sens = day.sensacio && day.sensacio[m.id];
    const sd = sens ? SENSACIONS.find(x=>x.id===sens) : null;
    h += `<tr><td style="width:92px"><b>${m.n}</b><div class="xs muted">${m.h}</div></td>
      <td>${a?esc(a.n):'<span class="muted">—</span>'}
      ${a && a.tipus==="fora" ? `<div class="xs"><span class="tag blau">fora de casa</span>
          ${a.lloc?" "+esc(a.lloc):""}</div>` : ""}
      ${a && a.tipus==="lliure" ? `<div class="xs"><span class="tag">adaptat per ella</span></div>` : ""}
      ${a && a.tipus!=="fora" ? `<div class="xs muted">${esc(ingList(a.i))}</div>` : ""}
      ${c && c.falten.length ? `<div class="xs muted">Hi falta: ${c.falten.map(x=>esc(x.t)).join(" · ")}</div>` : ""}
      ${sd ? `<div class="xs" style="margin-top:2px"><span class="quad" style="background:${sd.color}"></span>
          <span class="muted"> s'hi ha sentit ${esc(sd.n.toLowerCase())}</span></div>` : ""}
      ${(()=>{ const sp=supervisioDe(day,m.id); const sx=sp?SUPERVISIO.find(x=>x.id===sp):null;
         return sx?`<div class="xs" style="margin-top:2px"><span class="sup ${sx.omplert}"></span>
           <span class="muted"> ${esc(sx.n.toLowerCase())}</span></div>`:""; })()}</td>
      <td style="width:34px">${ms?`<span class="dot ${ms.lvl}"></span>`
        :(c&&c.complet?`<span class="dot v"></span>`:"")}</td></tr>`;
    if(m.id==="dinar"||m.id==="sopar"){
      const p = dishById(day.postres[m.id]);
      if(p) h += `<tr><td class="xs muted">postres</td><td class="small">${esc(p.n)}</td><td></td></tr>`;
    }
  }
  h += `</table>`;

  h += `<div class="sec-title"><h2 style="font-size:15px">Indicacions d'hàbits</h2></div><div class="inds">`+
    HABITS.map(x=>`<button class="ind ${day.habits.includes(x.id)?"on":""}"
      onclick="toggleHabit('${ds}','${x.id}')">${day.habits.includes(x.id)?"✓":"○"} ${esc(x.n)}</button>`)
    .join("")+`</div>`;

  if(obert){

async function pintarGaleriaDia(ds){
  const cont = document.getElementById("galDia"); if(!cont) return;
  const day = dayData(ds);
  const ms = Object.keys(day.fotos||{});
  if(!ms.length){ cont.innerHTML = `<div class="small muted">Encara no s'ha fet cap foto aquest dia.</div>`; return; }
  cont.innerHTML = "";
  for(const mid of ms){
    const blob = await Sync.baixarFoto(ds, mid);
    const m = MEALS.find(x=>x.id===mid) || {n:mid};
    const d = document.createElement("div");
    d.className = "gfoto";

      const url = URL.createObjectURL(blob);
      d.innerHTML = `<img src="${url}" alt="${esc(m.n)}"><div class="c"><b>${esc(m.n)}</b>${esc(fmtDay(parseDay(ds)))}</div>`;
      d.querySelector("img").onclick = ()=>obrirZoom(url);
    } else {
      d.innerHTML = `<div class="c" style="padding:22px 8px;text-align:center">
        <b>${esc(m.n)}</b>Foto al mòbil, encara no descarregada</div>`;
    }
    cont.appendChild(d);
  }
}

/* =====================================================================
   PROGRAMACIÓ DE SETMANES
   ===================================================================== */
function proposar(){
  const n = proposarSetmana(cursor, {desde:TODAY});
  guardarSetmanaSencera();
  if(!n) alert("Aquesta setmana ja està completa o els dies són anteriors a avui.");
  render();
}
function programarSeguent(){
  cursor = addDays(monday(TODAY), 7);
  proposarSetmana(cursor, {desde:cursor});
  guardarSetmanaSencera();
  tab = "setmana"; render();
}
function copiarSetmana(){
  const prev = weekData(addDays(cursor,-7));
  let n = 0;
  for(let i=0;i<7;i++){
    const dt = addDays(cursor,i);
    if(dt < TODAY) continue;
    const day = dayData(iso(dt));
    if(esValidat(day)) continue;
    const src = prev[iso(addDays(cursor,-7+i))];
    if(!src) continue;
    day.meals   = Object.assign({}, src.meals);
    day.postres = Object.assign({}, src.postres);
    n++;
  }
  guardarSetmanaSencera(); render();
  if(!n) alert("La setmana anterior no té cap menú desat.");
}
function buidarSetmana(){
  if(!confirm("Vols esborrar els menús d'aquesta setmana a partir d'avui? Els dies validats i els passats es conserven.")) return;
  for(let i=0;i<7;i++){
    const dt = addDays(cursor,i);
    if(dt < TODAY) continue;
    const day = dayData(iso(dt));
    if(esValidat(day)) continue;
    day.meals = {}; day.postres = {};
  }
  guardarSetmanaSencera(); render();
}
function guardarSetmanaSencera(){
  for(let i=0;i<7;i++){
    const ds = iso(addDays(cursor,i));
    const d = dayData(ds); d.u = Date.now();
  }
  saveState(true);
  Sync.pushSetmana(weekKey(cursor));
}

  const q = cercaPlats.toLowerCase().trim();
  let list = actius;
  if(filtrePlats!=="tots") list = list.filter(d=>d.m.includes(filtrePlats));
  if(q) list = list.filter(d=>d.n.toLowerCase().includes(q) ||
      Object.keys(d.i).some(k=>ing(k)&&ing(k).n.toLowerCase().includes(q)));
  list = list.slice().sort((a,b)=>a.n.localeCompare(b.n));

  h += `<div class="card pad" style="margin-bottom:14px">
    <div class="row" style="flex-wrap:wrap;gap:8px">
      <input class="search" style="flex:1;min-width:200px;margin:0" placeholder="Cercar plat o ingredient…"
        value="${esc(cercaPlats)}" oninput="cercaPlats=this.value;render()">
      <button class="btn" onclick="cfgFrom(null)">+ Afegir un plat</button>
    </div>
    <div class="chips" style="margin-top:10px">`+
    [["tots","Tots"]].concat(MEALS.map(m=>[m.id,m.n]))
      .map(([k,n])=>`<button class="chip ${filtrePlats===k?"on":""}"
        onclick="filtrePlats='${k}';render()">${n}</button>`).join("")+
    `</div></div>`;

  h += `<div class="card pad"><div class="small muted" style="margin-bottom:10px">
    ${list.length} plat${list.length===1?"":"s"}</div><div class="dishlist" style="max-height:none">`;
  h += list.length ? list.map(d=>{
      const mealRef = d.m.includes("sopar")?"sopar":d.m[0];
      const f = (mealRef==="dinar"||mealRef==="sopar") ? faltaApat(d.i, mealRef) : checkMeal(d.id, mealRef);
      const ms = obert ? scoreMealFull(d.id, mealRef) : null;
      return `<div class="dish" style="cursor:default">
        ${ms?`<span class="dot ${ms.lvl}" style="margin-top:6px"></span>`
            :(f.complet?`<span class="dot v" style="margin-top:6px"></span>`
                       :`<span class="dot" style="margin-top:6px;background:#e0ddd2"></span>`)}
        <div class="info">
          <div class="t">${esc(d.n)}
            ${d.base?"":'<span class="tag">afegit</span>'}
            ${d.editat?'<span class="tag blau">modificat</span>':""}
            ${d.src&&d.base&&!d.editat?`<span class="tag">${esc(d.src)}</span>`:""}</div>
          <div class="xs muted" style="margin-top:2px">${d.m.map(x=>(MEALS.find(y=>y.id===x)||{n:x}).n).join(" · ")}</div>
          <div class="ing">${esc(ingList(d.i))}</div>
          ${!f.complet ? `<div class="xs" style="color:#8a6410;margin-top:3px">Hi falta:
            ${(f.falten||[]).map(x=>esc(x.t||x)).join(" · ")}</div>` : ""}
          ${obert?`<div class="mac">${Math.round(ms.t.kcal)} kcal · ${Math.round(ms.t.p)} g P · ${Math.round(ms.t.c)} g HC · ${Math.round(ms.t.f)} g G</div>`:""}
        </div>
        <div style="display:flex;flex-direction:column;gap:5px">
          <button class="btn ghost sm" onclick="cfgFrom('${d.id}')">editar</button>
          <button class="btn ghost sm" onclick="cfgFrom('${d.id}','duplicar')">duplicar</button>
          ${d.editat?`<button class="btn ghost sm" onclick="restaurarPlat('${d.id}')">original</button>`:""}
          <button class="btn danger sm" onclick="retirarPlat('${d.id}')">${d.base?"retirar":"esborrar"}</button>
        </div></div>`;
    }).join("") : `<div class="muted pad">Cap plat amb aquest filtre.</div>`;
  h += `</div></div>`;

  if(retirats.length){
    h += `<div class="sec-title"><h2>Plats retirats</h2>
      <span class="muted small">no surten a les llistes, però es poden recuperar</span></div>
      <div class="card pad"><table>`+
      retirats.map(d=>`<tr><td>${esc(d.n)}</td>
        <td class="xs muted">${esc(ingListShort(d.i,4))}</td>
        <td style="width:110px"><button class="btn ghost sm" onclick="tornarPlat('${d.id}')">tornar-lo a posar</button></td>
        </tr>`).join("")+`</table></div>`;
  }
  return h;
}

/* --- receptes de les elaboracions --- */
function seccioReceptes(){
  const A = allIng();
  const preps = Object.entries(A).filter(([k,v])=>v.prep);
  let h = `<div class="card pad"><div class="spread" style="margin-bottom:12px">
    <div class="small muted" style="max-width:640px">
    Aquestes són les elaboracions que es fan a casa. El text és el que es veu <b>també al mòbil</b>,
    perquè ella pugui preparar-les. La composició serveix perquè la llista de la compra sàpiga
    quins ingredients calen: si canvies la recepta, canvia-la també aquí.</div>
    <button class="btn" onclick="novaRecepta()">+ Afegir una recepta</button></div>`;
  for(const [k,v] of preps){
    h += `<div style="border:1px solid var(--linia);border-radius:12px;padding:14px;margin-bottom:12px">
      <div class="spread"><b style="font-size:15px">${esc(v.n)}</b>
        ${v.editat?'<span class="tag blau">modificada</span>':""}</div>
      <textarea class="search" id="rec_${k}" style="min-height:110px;margin-top:10px;font-family:inherit"
        >${esc(v.recepta||"")}</textarea>
      <div class="xs muted" style="margin:6px 0 4px">Composició per cada 100 g de producte acabat:</div>
      <div class="row" style="flex-wrap:wrap;gap:6px">`+
      Object.entries(v.prep||{}).map(([sk,g])=>
        `<span class="row" style="gap:4px;border:1px solid var(--linia);border-radius:9px;padding:4px 8px">
          <span class="xs">${esc(A[sk]?A[sk].n:sk)}</span>
          <input type="number" step="0.1" id="prep_${k}_${sk}" value="${g}"
            style="width:62px;padding:3px 5px;border:1px solid var(--linia);border-radius:6px;text-align:right">
          <span class="xs muted">g</span></span>`).join("")+
      `</div>
      <div class="row" style="margin-top:11px">
        <button class="btn sm" onclick="desarRecepta('${k}')">Desar</button>
        ${v.editat?`<button class="btn ghost sm" onclick="restaurarRecepta('${k}')">Tornar a l'original</button>`:""}
        ${v.meu?`<button class="btn danger sm" onclick="esborrarRecepta('${k}')">Esborrar</button>`:""}
        ${v.prep&&Object.keys(v.prep).length<12
          ? `<button class="btn ghost sm" onclick="afegirIngRecepta('${k}')">+ ingredient</button>`:""}
      </div></div>`;
  }
  if(!preps.length) h += `<div class="muted">Encara no hi ha cap recepta.</div>`;
  return h+`</div>`;
}

let compFiles = [];
function afegirFilaComp(){
  const A = allIng();
  const idx = compFiles.length;
  compFiles.push(idx);
  const opcions = Object.entries(A).filter(([k,v])=>!v.prep)
    .sort((a,b)=>a[1].n.localeCompare(b[1].n))
    .map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join("");
  const cont = document.getElementById("nr_comp");
  const div = document.createElement("div");
  div.className = "row";
  div.style.cssText = "gap:8px;margin-bottom:7px";
  div.innerHTML = `<select class="search" style="margin:0;flex:1" id="nc_k_${idx}">${opcions}</select>
    <input class="search" style="margin:0;width:90px" type="number" step="0.1" id="nc_g_${idx}" placeholder="g/100">
    <button class="close" onclick="this.parentNode.remove()">×</button>`;
  cont.appendChild(div);
}
function desarNovaRecepta(){
  const nom = $("#nr_n").value.trim();
  if(!nom) return alert("Posa un nom a la recepta.");
  const txt = $("#nr_txt").value.trim();
  if(!txt) return alert("Escriu com es fa.");
  const prep = {};
  for(const i of compFiles){
    const ks = document.getElementById("nc_k_"+i), gs = document.getElementById("nc_g_"+i);
    if(!ks || !gs || !gs.value) continue;
    prep[ks.value] = (prep[ks.value]||0) + (+gs.value||0);
  }
  const k = "r_"+nom.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_|_$/g,"")+"_"+Date.now().toString(36);
  const o = {n:nom, cat:$("#nr_cat").value, shop:"Elaboracions",
             ml:$("#nr_ml").value==="ml", qtyRef:+$("#nr_q").value||100,
             recepta:txt, prep, meu:true};
  const ul = $("#nr_ul").value.trim(), uq = +$("#nr_uq").value;
  if(ul && uq>0){ o.ul = ul; o.uq = uq; }
  S.customIng[k] = o;
  QTY_REF[k] = o.qtyRef;
  apuntarCanvi("Ha afegit la recepta «"+nom+"»");
  tocarConfig(); closeModal(); render();
}
function esborrarRecepta(k){
  if(!confirm("Esborrar aquesta recepta?")) return;
  const n = ing(k).n;
  delete S.customIng[k];
  apuntarCanvi("Ha esborrat la recepta «"+n+"»");
  tocarConfig(); render();
}
function afegirIngRecepta(k){
  const A = allIng();
  const opcions = Object.entries(A).filter(([ik,v])=>!v.prep)
    .sort((a,b)=>a[1].n.localeCompare(b[1].n))
    .map(([ik,v])=>`<option value="${ik}">${esc(v.n)}</option>`).join("");
  openModal(`<div class="mhead"><h3>Afegir ingredient a ${esc(A[k].n)}</h3>
    <button class="close" onclick="closeModal()">×</button></div><div class="mbody">
    <select class="search" id="ai_k">${opcions}</select>
    <div class="qrow"><span class="nm">Grams per cada 100 g de producte</span>
      <input type="number" step="0.1" id="ai_g" value="10"></div>
    <button class="btn" style="margin-top:12px" onclick="ferAfegirIngRecepta('${k}')">Afegir</button>
    </div>`, true);
}
function ferAfegirIngRecepta(k){
  const sk = $("#ai_k").value, g = +$("#ai_g").value||0;
  if(!g) return alert("Posa una quantitat.");
  const actual = ing(k);
  const prep = Object.assign({}, actual.prep, {[sk]: g});
  if(S.customIng[k]) S.customIng[k].prep = prep;
  else S.editsIng[k] = Object.assign({}, S.editsIng[k], {prep, recepta:actual.recepta});
  apuntarCanvi("Ha afegit "+(ing(sk)?ing(sk).n:sk)+" a la recepta «"+actual.n+"»");
  tocarConfig(); closeModal(); render();
}
function desarRecepta(k){
  const base = ING[k]; if(!base) return;
  const prep = {};
  for(const sk of Object.keys(base.prep||{})){
    const el = document.getElementById("prep_"+k+"_"+sk);
    if(el) prep[sk] = +el.value || 0;
  }
  S.editsIng[k] = Object.assign({}, S.editsIng[k], {
    recepta: document.getElementById("rec_"+k).value.trim(), prep
  });
  apuntarCanvi("Ha modificat la recepta de «"+base.n+"»");
  tocarConfig(); render();
}
function restaurarRecepta(k){
  if(!confirm("Tornar la recepta a com venia?")) return;
  delete S.editsIng[k];
  apuntarCanvi("Ha restaurat la recepta original de «"+ING[k].n+"»");
  tocarConfig(); render();
}

/* --- quantitats per ració --- */
function seccioRacions(){
  const R = racions();
  let h = `<div class="card pad"><div class="small muted" style="margin-bottom:14px">
    Aquesta és la peça central: una ració de cada grup. Tots els aliments d'un grup són
    intercanviables entre ells, i quan ella adapta un àpat l'aplicatiu li proposa aquestes
    quantitats. <b>Canviar un número aquí afecta tots els plats i tots els suggeriments alhora.</b>
    Les quantitats marcades com a <i>deduïda</i> no surten literalment de les guies: les vaig
    calcular per equivalència i són les primeres a revisar.</div>`;
  for(const [grup, d] of Object.entries(R)){
    h += `<div style="border:1px solid var(--linia);border-radius:12px;padding:14px;margin-bottom:12px">
      <div class="spread"><b style="font-size:15px">${esc(d.n)}</b>
        <span class="row" style="gap:6px"><span class="xs muted">racions per àpat</span>
        <input type="number" step="1" min="0" id="rac_per_${grup}" value="${d.perApat}"
          style="width:58px;padding:4px 6px;border:1px solid var(--linia);border-radius:7px;text-align:right"></span>
      </div>
      <div class="xs muted" style="margin:3px 0 10px">${esc(d.ajuda||"")}</div>
      <table>`;
    for(const [k,a] of Object.entries(d.aliments)){
      const nom = ing(k) ? ing(k).n : k;
      const et = a.font==="editat" ? '<span class="tag blau">canviada</span>'
               : a.font==="equivalent" ? '<span class="tag">deduïda</span>' : "";
      h += `<tr><td>${esc(nom)} ${et}
        ${a.nota?`<div class="xs muted">${esc(a.nota)}</div>`:""}</td>
        <td style="width:120px;text-align:right">
          <input type="number" step="5" min="1" id="rac_${grup}_${k}" value="${a.g}"
            style="width:78px;padding:4px 6px;border:1px solid var(--linia);border-radius:7px;text-align:right">
          <span class="xs muted">${ing(k)&&ing(k).ml?"ml":"g"}</span></td></tr>`;
    }
    h += `</table><div class="row" style="margin-top:11px">
      <button class="btn sm" onclick="desarRacions('${grup}')">Desar ${esc(d.n.toLowerCase())}</button>
      ${S.racions[grup]?`<button class="btn ghost sm" onclick="restaurarRacions('${grup}')">Tornar a l'original</button>`:""}
      </div></div>`;
  }
  return h+`</div>`;
}
function desarRacions(grup){
  const R = RACIONS_BASE[grup]; if(!R) return;
  const canvis = {aliments:{}};
  const per = document.getElementById("rac_per_"+grup);
  if(per && +per.value !== R.perApat) canvis.perApat = +per.value;
  const actual = racions()[grup];
  for(const k of Object.keys(actual.aliments)){
    const el = document.getElementById("rac_"+grup+"_"+k);
    if(!el) continue;
    const v = +el.value || 0;
    const orig = R.aliments[k] ? R.aliments[k].g : null;
    if(v>0 && v!==orig) canvis.aliments[k] = {g:v};
  }
  if(!Object.keys(canvis.aliments).length && canvis.perApat==null) delete S.racions[grup];
  else S.racions[grup] = canvis;
  apuntarCanvi("Ha canviat les quantitats del grup «"+R.n+"»");
  tocarConfig(); render();
}
function restaurarRacions(grup){
  if(!confirm("Tornar les quantitats d'aquest grup a com venien?")) return;
  delete S.racions[grup];
  apuntarCanvi("Ha restaurat les quantitats originals del grup «"+RACIONS_BASE[grup].n+"»");
  tocarConfig(); render();
}

/* =====================================================================
   LLISTA DE LA COMPRA
   ===================================================================== */
let compraTot = false;
function viewCompra(){
  const {out, preps} = compraDe(cursor, !compraTot);
  const {sec, claus} = agruparCompra(out);
  let h = `<div class="sec-title"><h2>Llista de la compra</h2>
    <span class="muted small">Les elaboracions es descomponen soles en ingredients</span>
    <span style="margin-left:auto" class="no-print">
      <button class="btn ghost sm" onclick="compraTot=!compraTot;render()">
        ${compraTot?"Setmana sencera":"Des d'avui fins diumenge"}</button>
      <button class="btn ghost sm" onclick="copiarCompra()">Copiar el text</button>
      <button class="btn ghost sm" onclick="window.print()">Imprimir</button>
    </span></div>`;
  if(!claus.length) return h+`<div class="card pad muted">Encara no hi ha cap menú triat aquesta setmana.</div>`;
  h += `<div class="card pad">`;
  for(const k of claus){
    h += `<h3 style="font-size:13px;color:var(--verd-fosc);margin:14px 0 4px;
      text-transform:uppercase;letter-spacing:.05em">${esc(k)}</h3><table>`;
    for(const [ik,g] of sec[k]){
      const tinc = !!S.pantry[ik];
      h += `<tr style="${tinc?"opacity:.4;text-decoration:line-through":""}">
        <td style="width:26px"><input type="checkbox" ${tinc?"checked":""} onchange="togglePantry('${ik}')"></td>
        <td>${esc(ing(ik).n)}</td>
        <td class="qty" style="text-align:right;width:170px">${esc(qtyTxt(ik, shopRound(g)))}</td></tr>`;
    }
    h += `</table>`;
  }
  h += `</div>`;
  if(preps.length){
    h += `<div class="sec-title"><h2>Elaboracions a preparar</h2></div><div class="card pad small">`+
      preps.map(k=>`<div style="padding:8px 0;border-bottom:1px solid #f2f0e8">
        <b>${esc(ing(k).n)}</b><div class="muted">${esc(ing(k).recepta||"")}</div></div>`).join("")+
      `</div>`;
  }
  return h;
}
function togglePantry(k){
  if(S.pantry[k]) delete S.pantry[k]; else S.pantry[k]=1;
  saveState(true); render();
}
function copiarCompra(){
  const {out} = compraDe(cursor, !compraTot);
  const {sec, claus} = agruparCompra(out);
  let txt = "LLISTA DE LA COMPRA · setmana "+weekKey(cursor)+"\n";
  for(const k of claus){
    txt += "\n"+k.toUpperCase()+"\n";
    for(const [ik,g] of sec[k]) txt += "  · "+ing(ik).n+" — "+qtyTxt(ik, shopRound(g))+"\n";
  }
  navigator.clipboard.writeText(txt).then(
    ()=>alert("Llista copiada."), ()=>prompt("Copia la llista:", txt));
}

/* =====================================================================
   HISTORIAL
   ===================================================================== */
let obertes = {};
function viewHistorial(){
  const keys = Object.keys(S.weeks).filter(k =>
    Object.values(S.weeks[k]).some(d=>Object.keys(d.meals||{}).length)).sort().reverse();
  let h = `<div class="sec-title"><h2>Historial</h2>
    <span class="muted small">Consulta el que s'ha fet en setmanes anteriors</span></div>`;
  if(!keys.length) return h+`<div class="card pad muted">Encara no hi ha res desat.</div>`;

  let nd=0, nv=0, neq=0, tk=0, tp=0;
  const freq = {};
  for(const k of keys) for(const day of Object.values(S.weeks[k])){
    if(!Object.keys(day.meals||{}).length) continue;
    nd++;
    if(esValidat(day)) nv++;
    if(checkDay(day).complet) neq++;
    if(obert){ const sc = scoreDayFull(day); tk+=sc.kcal; tp+=sc.prot; }
    for(const id of Object.values(day.meals)){ const d=dishById(id); if(d) freq[d.n]=(freq[d.n]||0)+1; }
  }
  const top = Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8);
  h += `<div class="card pad" style="margin-bottom:14px"><div class="macro">
      <div><div class="v">${nd}</div><div class="l">dies amb menú</div></div>
      <div><div class="v">${nv}</div><div class="l">dies validats</div></div>
      <div><div class="v">${Math.round(neq/nd*100)}%</div><div class="l">dies equilibrats</div></div>`+
      (obert?`<div><div class="v">${Math.round(tk/nd)}</div><div class="l">kcal de mitjana</div></div>`
            :`<div><div class="v">${keys.length}</div><div class="l">setmanes</div></div>`)+
    `</div>
    ${top.length?`<div class="xs muted">Plats més repetits: ${top.map(t=>esc(t[0])+" ("+t[1]+")").join(" · ")}</div>`:""}
    </div>`;

  for(const k of keys){
    const w = S.weeks[k];
    const dies = Object.keys(w).filter(ds=>Object.keys(w[ds].meals||{}).length).sort();
    if(!dies.length) continue;
    const ob = obertes[k];
    const nvS = dies.filter(ds=>esValidat(w[ds])).length;
    const neS = dies.filter(ds=>checkDay(w[ds]).complet).length;
    h += `<div class="hist-week"><div class="hw-head" onclick="obertes['${k}']=!obertes['${k}'];render()">
      <div><b>Setmana ${esc(k)}</b> ${k===weekKey(cursor)?'<span class="tag">visible</span>':""}
        <div class="xs muted">${dies.length} dies · ${nvS} validats · ${neS} equilibrats</div></div>
      <div class="row">${dies.map(ds=>{
        const d = w[ds];
        return obert
          ? `<span class="dot ${scoreDayFull(d).lvl}"></span>`
          : (checkDay(d).complet?`<span class="dot v"></span>`:`<span class="dot" style="background:#e0ddd2"></span>`);
      }).join("")}<span class="muted" style="margin-left:6px">${ob?"▾":"▸"}</span></div></div>`;
    if(ob){
      h += `<div class="card pad" style="margin-top:6px"><table>
        <tr><th>Dia</th>${MEALS.map(m=>`<th>${m.n}</th>`).join("")}
        ${obert?"<th>kcal</th>":""}<th></th></tr>`;
      for(const ds of dies){
        const day = w[ds], dt = parseDay(ds);
        h += `<tr><td><b>${DIES[(dt.getDay()+6)%7].slice(0,3)}</b>
          <span class="xs muted">${fmtDay(dt)}</span>
          ${esValidat(day)?'<span class="tag blau">✓</span>':""}</td>`;
        for(const m of MEALS){
          const d = dishById(day.meals[m.id]);
          h += `<td class="small">${d?esc(d.n):'<span class="muted">—</span>'}</td>`;
        }
        if(obert) h += `<td class="qty">${Math.round(scoreDayFull(day).kcal)}</td>`;
        h += `<td>${obert?`<span class="dot ${scoreDayFull(day).lvl}"></span>`
                        :(checkDay(day).complet?'<span class="dot v"></span>':"")}</td></tr>`;
      }
      h += `</table><button class="btn ghost sm" style="margin-top:10px"
        onclick="anarASetmana('${dies[0]}')">Obrir aquesta setmana</button></div>`;
    }
    h += `</div>`;
  }
  return h;
}
function anarASetmana(ds){ cursor = monday(parseDay(ds)); tab="setmana"; render(); }

function viewRegistre(){
  const dies = [];
  for(const [k,w] of Object.entries(S.weeks))
    for(const [ds,d] of Object.entries(w))
      if(esValidat(d)) dies.push([ds,d]);
  dies.sort((a,b)=>b[0].localeCompare(a[0]));

  let h = `<div class="sec-title"><h2>Registre per a la nutricionista</h2>
    <span class="muted small">Només els dies validats</span>
    <span style="margin-left:auto" class="no-print">
      <button class="btn ghost sm" onclick="window.print()">Imprimir o desar en PDF</button>
      <button class="btn ghost sm" onclick="exportarRegistre()">Exportar en text</button></span></div>`;
  if(!dies.length) return h+`<div class="card pad muted">
    Encara no hi ha cap dia validat. Valida un dia des de la vista de setmana
    o des del seu detall perquè quedi al registre.</div>`;

  h += llegendaMarques({sup:true, sens:true});
  h += `<div class="card pad"><table><tr><th>Dia</th><th>Àpats</th>
    <th>Hàbits</th>${obert?"<th>kcal</th><th>Prot.</th>":""}<th>Fotos</th></tr>`;
  for(const [ds,day] of dies){
    const dt = parseDay(ds);
    const sc = obert ? scoreDayFull(day) : null;
    const nf = Object.keys(day.fotos||{}).length;
    h += `<tr><td style="white-space:nowrap"><b>${DIES[(dt.getDay()+6)%7]}</b>
      <div class="xs muted">${fmtDay(dt)} ${dt.getFullYear()}</div></td>
      <td class="small">`+MEALS.map(m=>{
        const a = apatDelDia(day, m.id);
        if(!a) return "";
        const sens = day.sensacio && day.sensacio[m.id];
        const sd = sens ? SENSACIONS.find(x=>x.id===sens) : null;
        const sup = supervisioDe(day, m.id);
        const sx = sup ? SUPERVISIO.find(x=>x.id===sup) : null;
        /* La sensació és un QUADRAT, igual que a la setmana i al detall
           del dia. Aquí hi havia un cercle i es confonia amb la marca
           de com havia quedat l'àpat. */
        return `<div><span class="muted xs">${m.n}:</span> ${esc(a.n)}
          ${a.tipus==="fora"?'<span class="tag blau">fora</span>':""}
          ${a.tipus==="lliure"?'<span class="tag">adaptat</span>':""}
          ${sx?`<span class="sup ${sx.omplert}" title="${esc(sx.n)}"></span>`:""}
          ${sd?`<span class="quad" style="background:${sd.color}" title="S'hi ha sentit ${esc(sd.n.toLowerCase())}"></span>`:""}</div>`;
      }).join("")+`</td>
      <td class="xs muted">${day.habits.length}/${HABITS.length}</td>
      ${obert?`<td class="qty">${Math.round(sc.kcal)}</td><td class="qty">${Math.round(sc.prot)}</td>`:""}
      <td>${nf?`<button class="btn ghost sm" onclick="obrirDia('${ds}')">${nf} ◉</button>`:'<span class="muted xs">—</span>'}</td>
      </tr>`;
  }
  h += `</table></div>`;
  return h;
}
function exportarRegistre(){
  let txt = "REGISTRE DE MENÚS VALIDATS\n";
  const dies = [];
  for(const w of Object.values(S.weeks))
    for(const [ds,d] of Object.entries(w)) if(esValidat(d)) dies.push([ds,d]);
  dies.sort();
  for(const [ds,day] of dies){
    txt += "\n"+fmtLong(parseDay(ds))+"\n";
    for(const m of MEALS){
      const d = dishById(day.meals[m.id]);
      if(d) txt += "  "+m.n.padEnd(10)+" "+d.n+"\n         "+ingList(d.i)+"\n";
    }
    const hs = day.habits.map(id=>(HABITS.find(x=>x.id===id)||{n:id}).n);
    if(hs.length) txt += "  Hàbits:  "+hs.join(" · ")+"\n";
  }
  navigator.clipboard.writeText(txt).then(
    ()=>alert("Registre copiat al porta-retalls."), ()=>prompt("Copia el registre:", txt));
}

/* =====================================================================
   SEGUIMENT — informe per a la nutricionista i la psicòloga
   ---------------------------------------------------------------------
   Descriu el que ha passat, no ho interpreta. Les conclusions les treuen
   elles a la consulta.
   ===================================================================== */
let periode = "setmana";   // setmana | quatre | mes

function diesDelPeriode(){
  let ini, fi = addDays(monday(cursor), 6);
  if(periode==="setmana") ini = monday(cursor);
  else if(periode==="quatre"){ ini = addDays(monday(cursor), -21); }
  else { const c = parseDay(iso(cursor)); ini = new Date(c.getFullYear(), c.getMonth(), 1);
         fi = new Date(c.getFullYear(), c.getMonth()+1, 0); }
  const out = [];
  for(let d = new Date(ini); d <= fi; d = addDays(d,1)){
    const ds = iso(d), w = S.weeks[weekKey(d)];
    const day = w && w[ds];
    if(day && apatsFets(day) > 0) out.push([ds, day]);
  }
  return {dies:out, ini, fi};
}

function analitzar(dies){
  const r = {
    nDies:dies.length, complets:0, validats:0, equilibrats:0, valorables:0,
    apats:{total:0, programat:0, lliure:0, fora:0},
    sensPerApat:{}, sensTotal:{v:0,t:0,r:0}, senseSens:0,
    sup:{sup:0, prep:0, sola:0, sense:0}, supPerApat:{},
    fora:[], adaptats:[], habits:{}, tria:{},
  };
  for(const m of MEALS){ r.sensPerApat[m.id] = {v:0,t:0,r:0, total:0};
    r.supPerApat[m.id] = {sup:0, prep:0, sola:0, total:0}; }
  for(const h of HABITS) r.habits[h.id] = 0;

  for(const [ds, day] of dies){
    const chk = checkDay(day);
    if(chk.fets === 5) r.complets++;
    if(esValidat(day)) r.validats++;
    if(chk.valorable){ r.valorables++; if(chk.complet) r.equilibrats++; }
    for(const h of day.habits||[]) if(r.habits[h]!=null) r.habits[h]++;

    for(const m of MEALS){
      const a = apatDelDia(day, m.id);
      if(!a) continue;
      r.apats.total++;
      r.apats[a.tipus==="plat" ? "programat" : a.tipus]++;
      if(a.tipus==="fora") r.fora.push({ds, apat:m.n, lloc:a.lloc, text:a.n});
      if(a.tipus==="lliure"){
        r.adaptats.push({ds, apat:m.n, n:a.n});
        for(const k of Object.keys(a.i)) r.tria[k] = (r.tria[k]||0)+1;
      }
      const s = day.sensacio && day.sensacio[m.id];
      if(s){ r.sensPerApat[m.id][s]++; r.sensPerApat[m.id].total++; r.sensTotal[s]++; }
      else r.senseSens++;
      const sp = supervisioDe(day, m.id);
      if(sp && r.sup[sp]!=null){ r.sup[sp]++; r.supPerApat[m.id][sp]++; r.supPerApat[m.id].total++; }
      else r.sup.sense++;
    }
  }
  return r;
}

function viewSeguiment(){
  const {dies, ini, fi} = diesDelPeriode();
  const et = {setmana:"Setmana visible", quatre:"Últimes 4 setmanes", mes:"Mes sencer"};
  let h = `<div class="sec-title"><h2>Seguiment</h2>
    <span class="muted small">${fmtDay(ini)} – ${fmtDay(fi)} ${fi.getFullYear()}</span>
    <span style="margin-left:auto" class="no-print">`+
    Object.entries(et).map(([k,v])=>
      `<button class="btn ${periode===k?"":"ghost"} sm" onclick="periode='${k}';render()">${v}</button>`).join(" ")+
    ` <button class="btn ghost sm" onclick="window.print()">Imprimir o desar en PDF</button>
      <button class="btn ghost sm" onclick="copiarSeguiment()">Copiar el text</button></span></div>`;

  if(!dies.length) return h+`<div class="card pad muted">No hi ha cap dia amb menú en aquest període.</div>`;
  const r = analitzar(dies);

  /* --- seguiment de l'estructura --- */
  h += `<div class="card pad" style="margin-bottom:14px">
    <div class="macro">
      <div><div class="v">${r.nDies}</div><div class="l">dies amb menú</div></div>
      <div><div class="v">${r.complets}</div><div class="l">amb els 5 àpats</div></div>
      <div><div class="v">${r.valorables?Math.round(r.equilibrats/r.valorables*100):0}%</div>
           <div class="l">dies equilibrats</div></div>
      <div><div class="v">${r.validats}</div><div class="l">dies validats</div></div>
    </div>
    <div class="small muted">Els dies amb algun àpat fora de casa (${r.apats.fora})
      no compten al percentatge d'equilibri: no en coneixem les quantitats.</div>
  </div>`;

  /* --- d'on surten els àpats --- */
  const pc = n => r.apats.total ? Math.round(n/r.apats.total*100) : 0;
  h += `<div class="sec-title"><h2>Com s'han resolt els àpats</h2>
    <span class="muted small">${r.apats.total} àpats en total</span></div>
    <div class="card pad"><table>
      <tr><td>Tal com estaven programats</td><td class="qty" style="text-align:right;width:110px">${r.apats.programat}</td>
        <td class="qty" style="width:60px;text-align:right">${pc(r.apats.programat)}%</td></tr>
      <tr><td>Adaptats per ella</td><td class="qty" style="text-align:right">${r.apats.lliure}</td>
        <td class="qty" style="text-align:right">${pc(r.apats.lliure)}%</td></tr>
      <tr><td>Fets fora de casa</td><td class="qty" style="text-align:right">${r.apats.fora}</td>
        <td class="qty" style="text-align:right">${pc(r.apats.fora)}%</td></tr>
    </table></div>`;

  /* --- acompanyament --- */
  const totalSup = r.sup.sup + r.sup.prep + r.sup.sola;
  h += `<div class="sec-title"><h2>Acompanyament dels àpats</h2>
    <span class="muted small">${totalSup} de ${r.apats.total} àpats registrats</span></div>`;
  if(!totalSup){
    h += `<div class="card pad muted">Encara no s'ha registrat l'acompanyament en aquest període.</div>`;
  } else {
    h += `<div class="card pad"><table>`;
    for(const x of SUPERVISIO){
      const n = r.sup[x.id], p = Math.round(n/totalSup*100);
      h += `<tr><td><span class="sup ${x.omplert}"></span> ${esc(x.n)}</td>
        <td class="qty" style="text-align:right;width:80px">${n}</td>
        <td class="qty" style="text-align:right;width:60px">${p}%</td>
        <td style="width:170px"><div class="kbar"><span style="width:${p}%;background:#5b6b7a"></span></div></td></tr>`;
    }
    h += `</table><div class="small muted" style="margin-top:10px">Descriu l'acompanyament que hi
      va haver, no com ho va fer ella. L'escala no ordena de millor a pitjor.</div>`;
    /* desglossat per àpat, que és el que orienta */
    const amb = MEALS.filter(m=>r.supPerApat[m.id].total>0);
    if(amb.length){
      h += `<table style="margin-top:14px"><tr><th>Àpat</th>
        ${SUPERVISIO.map(x=>`<th style="text-align:center">${esc(x.curt)}</th>`).join("")}</tr>`;
      for(const m of amb){
        const v = r.supPerApat[m.id];
        h += `<tr><td><b>${m.n}</b></td>`+
          SUPERVISIO.map(x=>`<td class="qty" style="text-align:center">${v[x.id]||"·"}</td>`).join("")+`</tr>`;
      }
      h += `</table>`;
    }
    h += `</div>`;
  }

  /* --- sensacions, desglossades per àpat --- */
  const totalSens = r.sensTotal.v + r.sensTotal.t + r.sensTotal.r;
  h += `<div class="sec-title"><h2>Com s'ha sentit en menjar</h2>
    <span class="muted small">${totalSens} de ${r.apats.total} àpats anotats · deixar-ho en blanc és una opció</span></div>`;
  if(!totalSens){
    h += `<div class="card pad muted">Encara no ha anotat cap sensació en aquest període.</div>`;
  } else {
    h += `<div class="card pad"><table>
      <tr><th>Àpat</th><th style="text-align:center">Bé</th><th style="text-align:center">Regular</th>
          <th style="text-align:center">Malament</th><th style="width:180px"></th></tr>`;
    for(const m of MEALS){
      const s = r.sensPerApat[m.id];
      if(!s.total) { h += `<tr><td>${m.n}</td><td colspan="4" class="xs muted">sense anotar</td></tr>`; continue; }
      const w = x => (x/s.total*100).toFixed(0);
      h += `<tr><td><b>${m.n}</b></td>
        <td class="qty" style="text-align:center">${s.v||"·"}</td>
        <td class="qty" style="text-align:center">${s.t||"·"}</td>
        <td class="qty" style="text-align:center">${s.r||"·"}</td>
        <td><div style="display:flex;height:9px;border-radius:99px;overflow:hidden;background:#eceadf">
          ${s.v?`<span style="width:${w(s.v)}%;background:#57a247"></span>`:""}
          ${s.t?`<span style="width:${w(s.t)}%;background:#d9a219"></span>`:""}
          ${s.r?`<span style="width:${w(s.r)}%;background:#c0392b"></span>`:""}
        </div></td></tr>`;
    }
    h += `</table>`;
    const durs = MEALS.map(m=>({m, s:r.sensPerApat[m.id]}))
      .filter(x=>x.s.total>=2)
      .map(x=>({n:x.m.n, prop:(x.s.t+x.s.r)/x.s.total, t:x.s.total}))
      .sort((a,b)=>b.prop-a.prop);
    if(durs.length && durs[0].prop>0){
      h += `<div class="small muted" style="margin-top:10px">L'àpat amb més anotacions en
        taronja o vermell és <b>${esc(durs[0].n.toLowerCase())}</b>
        (${Math.round(durs[0].prop*100)}% de ${durs[0].t} anotacions).</div>`;
    }
    h += `</div>`;
  }

  /* --- àpats fora de casa --- */
  h += `<div class="sec-title"><h2>Àpats fora de casa</h2>
    <span class="muted small">${r.fora.length}</span></div>`;
  h += r.fora.length ? `<div class="card pad"><table>`+
    r.fora.map(f=>`<tr><td style="width:110px;white-space:nowrap"><b>${DIES3[(parseDay(f.ds).getDay()+6)%7]}</b>
      <span class="xs muted">${fmtDay(parseDay(f.ds))}</span></td>
      <td style="width:80px" class="xs muted">${esc(f.apat)}</td>
      <td>${f.lloc?`<span class="tag blau">${esc(f.lloc)}</span> `:""}${esc(f.text)}</td></tr>`).join("")+
    `</table></div>`
    : `<div class="card pad muted">Cap en aquest període.</div>`;

  /* --- adaptacions --- */
  h += `<div class="sec-title"><h2>Àpats que ha adaptat</h2>
    <span class="muted small">${r.adaptats.length}</span></div>`;
  if(r.adaptats.length){
    const top = Object.entries(r.tria).sort((a,b)=>b[1]-a[1]).slice(0,10)
      .filter(([k])=>ing(k));
    h += `<div class="card pad"><table>`+
      r.adaptats.map(a=>`<tr><td style="width:110px;white-space:nowrap"><b>${DIES3[(parseDay(a.ds).getDay()+6)%7]}</b>
        <span class="xs muted">${fmtDay(parseDay(a.ds))}</span></td>
        <td style="width:80px" class="xs muted">${esc(a.apat)}</td>
        <td>${esc(a.n)}</td></tr>`).join("")+`</table>`;
    if(top.length) h += `<div class="small muted" style="margin-top:10px">
      Aliments que ha triat més sovint en adaptar: ${top.map(([k,n])=>esc(ing(k).n)+" ("+n+")").join(" · ")}.</div>`;
    h += `</div>`;
  } else h += `<div class="card pad muted">Cap en aquest període.</div>`;

  /* --- hàbits --- */
  h += `<div class="sec-title"><h2>Indicacions d'hàbits</h2></div><div class="card pad"><table>`+
    HABITS.map(x=>{
      const n = r.habits[x.id], p = r.nDies ? Math.round(n/r.nDies*100) : 0;
      return `<tr><td>${esc(x.n)}</td>
        <td class="qty" style="width:90px;text-align:right">${n} de ${r.nDies}</td>
        <td style="width:150px"><div class="kbar"><span style="width:${p}%"></span></div></td></tr>`;
    }).join("")+`</table></div>`;

  /* --- dades numèriques, només amb accés --- */
  if(obert){
    let tk=0, tp=0, n=0;
    for(const [ds, day] of dies){
      if(!checkDay(day).valorable) continue;
      const sc = scoreDayFull(day); tk += sc.kcal; tp += sc.prot; n++;
    }
    if(n){
      h += `<div class="sec-title"><h2>Mitjanes del període</h2>
        <span class="muted small">${n} dies sense àpats fora · només visible amb accés</span></div>
        <div class="card pad">${macroBox({kcal:tk/n, p:tp/n, c:0, f:0})
          .replace(/<div><div class="v">0<\/div><div class="l">hidrats g<\/div><\/div>\s*<div><div class="v">0<\/div><div class="l">greix g<\/div><\/div>/,
            `<div><div class="v">${Math.round(r.apats.fora/Math.max(1,r.nDies)*7)}</div><div class="l">àpats fora / setmana</div></div>
             <div><div class="v">${totalSens?Math.round((r.sensTotal.t+r.sensTotal.r)/totalSens*100):0}%</div>
             <div class="l">anotacions taronja o vermell</div></div>`)}
        <div class="small muted">Objectiu diari: ${targetActual().kcal} kcal i ${targetActual().prot} g de proteïna.</div>
        </div>`;
    }
  }
  return h;
}

function copiarSeguiment(){
  const {dies, ini, fi} = diesDelPeriode();
  if(!dies.length) return alert("No hi ha dades en aquest període.");
  const r = analitzar(dies);
  let t = "SEGUIMENT · "+fmtDay(ini)+" – "+fmtDay(fi)+" "+fi.getFullYear()+"\n\n";
  t += "Dies amb menú: "+r.nDies+"   amb els 5 àpats: "+r.complets+"   validats: "+r.validats+"\n";
  t += "Dies equilibrats: "+r.equilibrats+" de "+r.valorables+" valorables\n\n";
  t += "ÀPATS ("+r.apats.total+")\n";
  t += "  Tal com estaven programats: "+r.apats.programat+"\n";
  t += "  Adaptats per ella: "+r.apats.lliure+"\n";
  t += "  Fets fora de casa: "+r.apats.fora+"\n\n";
  t += "ACOMPANYAMENT\n";
  for(const x of SUPERVISIO) t += "  "+x.n.padEnd(36)+r.sup[x.id]+"\n";
  t += "  "+"Sense registrar".padEnd(36)+r.sup.sense+"\n\n";
  t += "SENSACIÓ EN MENJAR\n";
  for(const m of MEALS){
    const s = r.sensPerApat[m.id];
    t += "  "+m.n.padEnd(10)+(s.total ? "bé "+s.v+" · regular "+s.t+" · malament "+s.r : "sense anotar")+"\n";
  }
  if(r.fora.length){
    t += "\nÀPATS FORA DE CASA\n";
    for(const f of r.fora) t += "  "+f.ds+" "+f.apat+(f.lloc?" ("+f.lloc+")":"")+": "+f.text+"\n";
  }
  if(r.adaptats.length){
    t += "\nÀPATS ADAPTATS PER ELLA\n";
    for(const a of r.adaptats) t += "  "+a.ds+" "+a.apat+": "+a.n+"\n";
  }
  t += "\nHÀBITS\n";
  for(const x of HABITS) t += "  "+x.n.padEnd(42)+r.habits[x.id]+" de "+r.nDies+"\n";
  navigator.clipboard.writeText(t).then(()=>alert("Informe copiat."), ()=>prompt("Copia l'informe:", t));
}
