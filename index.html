function viewMissatges(){
  const jo = quiSoc();
  const msgs = (S.missatges||[]).slice().sort((a,b)=>b.quan.localeCompare(a.quan));
  let h = `<div class="sec-title"><h2>Taulell de missatges</h2>
    <span class="muted small">Entre tu, la nutricionista i la psicòloga · ella no hi té accés</span></div>`;

  h += `<div class="card pad" style="margin-bottom:14px">
    <textarea class="msgbox" id="msgNou" placeholder="Escriu un missatge…"></textarea>
    <div id="adjuntAvis" class="xs muted" style="margin-top:7px"></div>
    <div class="row" style="margin-top:9px;justify-content:space-between;flex-wrap:wrap;gap:8px">
      <span class="xs muted">${jo ? "Signaràs com a "+esc(jo) : "Sense sessió: signarà com a «aquest aparell»"}</span>
      <span class="row" style="gap:8px">
        <label class="btn ghost sm" style="cursor:pointer">Adjuntar un fitxer
          <input type="file" id="msgFitxer" accept=".pdf,.doc,.docx,image/*"
            style="display:none" onchange="triarAdjunt(this)"></label>
        <button class="btn" onclick="enviarMissatge()">Publicar</button>
      </span>
    </div>
    <div class="xs muted" style="margin-top:7px">PDF, document o imatge, fins a 8 MB.
      Cal tenir la sessió iniciada.</div></div>`;

  if(!msgs.length) return h+`<div class="card pad muted">Encara no hi ha cap missatge.</div>`;

  for(const m of msgs){
    const d = new Date(m.quan);
    const meu = jo && m.qui===jo;
    const nou = jo && !meu && !(m.llegits||{})[jo];
    const lectors = Object.keys(m.llegits||{});
    h += `<div class="msg ${meu?"meu":""} ${nou?"nou":""}">
      <div class="cap">
        <span class="qui">${esc(m.qui)}${meu?' <span class="tag">tu</span>':""}
          ${nou?'<span class="badge">nou</span>':""}</span>
        <span class="quan">${d.toLocaleDateString("ca-ES",{day:"numeric",month:"short"})}
          ${d.toLocaleTimeString("ca-ES",{hour:"2-digit",minute:"2-digit"})}</span>
      </div>
      <div class="txt">${esc(m.text)}</div>
      ${m.doc ? `<div class="row" style="margin-top:10px;gap:8px;border:1px solid var(--linia);
          border-radius:11px;padding:9px 12px;background:#fdfdfb">
          <span style="font-size:17px">📄</span>
          <span style="flex:1"><b class="small">${esc(m.doc.nom)}</b>
            <div class="xs muted">${(m.doc.mida/1024).toFixed(0)} kB</div></span>
          <button class="btn ghost sm" onclick='obrirAdjunt(${JSON.stringify(m.doc)})'>obrir</button>
        </div>` : ""}
      <div class="peu">
        <span>${lectors.length
          ? "Llegit per "+lectors.map(esc).join(", ")
          : '<span style="color:var(--gris)">Encara no l\'ha llegit ningú</span>'}</span>
        ${meu?`<button class="btn danger sm" onclick="treureMissatge('${m.id}')">esborrar</button>`:""}
      </div></div>`;
  }
  return h;
}

let adjuntPendent = null;
function triarAdjunt(inp){
  const f = inp.files[0];
  adjuntPendent = f || null;
  $("#adjuntAvis").innerHTML = f
    ? `📄 <b>${esc(f.name)}</b> (${(f.size/1024).toFixed(0)} kB) · s'enviarà amb el missatge
       <button class="close" style="font-size:15px" onclick="adjuntPendent=null;this.parentNode.innerHTML=''">×</button>`
    : "";
}
async function enviarMissatge(){
  const t = $("#msgNou").value;
  if(!t.trim() && !adjuntPendent) return;
  let doc = null;
  if(adjuntPendent){
    try{
      $("#adjuntAvis").textContent = "Enviant el fitxer…";
      doc = await Sync.pujarDocument(adjuntPendent);
      S.documents = S.documents || [];
      S.documents.unshift(doc);
    }catch(e){
      $("#adjuntAvis").innerHTML = `<span style="color:var(--vermell)">${esc(e.message)}</span>`;
      return;
    }
  }
  const m = escriureMissatge(t.trim() || ("Adjunta: "+doc.nom));
  if(m && doc) m.doc = doc;
  adjuntPendent = null;
  tocarConfig(); render();
}
async function obrirAdjunt(doc){
  const blob = await Sync.baixarDocument(doc);
  if(!blob) return alert("No s'ha pogut obtenir el fitxer. Comprova la connexió.");
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = doc.nom; a.target = "_blank";
  a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
function treureMissatge(id){
  if(!confirm("Esborrar aquest missatge?")) return;
  const m = (S.missatges||[]).find(x=>x.id===id);
  if(m && m.doc){
    Sync.esborrarDocument(m.doc).catch(()=>{});
    S.documents = (S.documents||[]).filter(d=>d.id!==m.doc.id);
  }
  esborrarMissatge(id); tocarConfig(); render();
}

function grafPes(serie){
  const t = tendenciaPes(serie, 7);
  const W = 900, H = 230, mx = 46, my = 18;
  const xs = t.map(p=>p.d.getTime());
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  const vals = t.map(p=>p.mitjana).concat(t.map(p=>p.kg));
  let v0 = Math.min(...vals), v1 = Math.max(...vals);
  const marge = Math.max(0.6, (v1-v0)*0.25);
  v0 -= marge; v1 += marge;
  const X = v => mx + (x1===x0 ? (W-mx-12)/2 : (v-x0)/(x1-x0)*(W-mx-12));
  const Y = v => my + (1-(v-v0)/(v1-v0))*(H-my*2);
  const linia = t.map((p,i)=>(i?"L":"M")+X(p.d.getTime()).toFixed(1)+" "+Y(p.mitjana).toFixed(1)).join(" ");

  let g = `<svg class="pesgraf" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
  for(let i=0;i<=4;i++){
    const v = v0 + (v1-v0)*i/4, y = Y(v);
    g += `<line class="eix" x1="${mx}" y1="${y.toFixed(1)}" x2="${W-12}" y2="${y.toFixed(1)}"/>
          <text x="4" y="${(y+3).toFixed(1)}">${v.toFixed(1)}</text>`;
  }
  for(const p of t) g += `<circle class="punt" cx="${X(p.d.getTime()).toFixed(1)}"
      cy="${Y(p.kg).toFixed(1)}" r="2.6"><title>${p.ds}: ${p.kg.toFixed(1)} kg</title></circle>`;
  g += `<path class="tend" d="${linia}"/>`;
  const marques = [t[0], t[Math.floor(t.length/2)], t[t.length-1]].filter(Boolean);
  for(const p of marques)
    g += `<text x="${X(p.d.getTime()).toFixed(1)}" y="${H-2}" text-anchor="middle">${fmtDay(p.d)}</text>`;
  return g+`</svg>`;
}

  h += `<div id="galTot"><div class="card pad muted">Carregant…</div></div>`;
  setTimeout(pintarGaleriaTot, 20);

async function pintarGaleriaTot(){
  const cont = document.getElementById("galTot"); if(!cont) return;
  const llista = [];
  for(const w of Object.values(S.weeks))
    for(const [ds,d] of Object.entries(w))
      for(const mid of Object.keys(d.fotos||{})) llista.push([ds,mid]);
  llista.sort((a,b)=>b[0].localeCompare(a[0]));
  if(!llista.length){
    cont.innerHTML = `<div class="card pad muted">Encara no s'ha fet cap foto des del mòbil.</div>`;
    return;
  }
  cont.innerHTML = `<div class="card pad"><div class="galeria" id="gal"></div></div>`;
  const gal = document.getElementById("gal");
  for(const [ds,mid] of llista.slice(0,120)){
    const m = MEALS.find(x=>x.id===mid) || {n:mid};
    const div = document.createElement("div");
    div.className = "gfoto";
    const blob = await Sync.baixarFoto(ds, mid);
    if(blob){
      const url = URL.createObjectURL(blob);
      div.innerHTML = `<img src="${url}" alt=""><div class="c"><b>${esc(m.n)}</b>${esc(fmtLong(parseDay(ds)))}</div>`;
      div.querySelector("img").onclick = ()=>obrirZoom(url);
    } else {
      div.innerHTML = `<div class="c" style="padding:26px 8px;text-align:center">
        <b>${esc(m.n)}</b>${esc(fmtDay(parseDay(ds)))} · no descarregada</div>`;
    }
    gal.appendChild(div);
  }
}

      <button class="btn ghost sm" onclick="exportar()">Exportar còpia (.json)</button>
      <label class="btn ghost sm" style="cursor:pointer">Importar còpia
        <input type="file" accept=".json" style="display:none" onchange="importar(this)"></label>
      <button class="btn danger sm" onclick="esborrarTot()">Esborrar-ho tot</button>
    </div>
  </div>`;
  return h;
}
async function entrar(){
  const err = document.getElementById("lgErr"); err.textContent = "";
  try{ await Sync.login($("#lgEmail").value.trim(), $("#lgPass").value); }
  catch(e){ err.textContent = "No s'ha pogut entrar. Comprova el correu i la contrasenya."; }
}
function exportar(){
  const b = new Blob([JSON.stringify(S,null,1)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(b);
  a.download = "menu-vega-"+iso(new Date())+".json";
  a.click();
}
function importar(inp){
  const f = inp.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const dades = JSON.parse(r.result);
      Object.assign(S, dades);
      saveState(); Sync.push(); render();
      alert("Còpia importada.");
    }catch(e){ alert("El fitxer no és vàlid."); }
  };
  r.readAsText(f);
}
function esborrarTot(){
  if(!confirm("Segur? S'esborraran tots els menús, plats i historial d'aquest aparell.")) return;
  localStorage.removeItem(KEY);
  location.reload();
}

/* =====================================================================
   RENDER
   ===================================================================== */
function tabsActuals(){
  const t = [
    {id:"setmana",      n:"Setmana",      f:viewSetmana},
    {id:"plats",        n:"Plats",        f:viewPlats},
    {id:"configurador", n:"Configurador", f:viewConfigurador},
    {id:"historial",    n:"Historial",    f:viewHistorial},
    {id:"seguiment",    n:"Seguiment",    f:viewSeguiment},
  ];
  if(obert){
    t.push({id:"pes",      n:"Pes",         f:viewPes});
    t.push({id:"registre", n:"Registre",    f:viewRegistre});
    t.push({id:"fotos",    n:"Fotografies", f:viewFotos});
  }
  const sn = missatgesSenseLlegir();
  t.push({id:"missatges", n:"Missatges"+(sn?" ("+sn+")":""), f:viewMissatges});
  t.push({id:"guia",   n:"Guia", f:viewGuia});
  t.push({id:"compra", n:"Llista de la compra", f:viewCompra});
  return t;
}
function render(){
  pintarPorta();
  const T = tabsActuals();
  if(!T.some(x=>x.id===tab)) tab = "setmana";
  /* en entrar al taulell, els missatges queden marcats com a llegits */
  if(tab==="missatges" && marcarLlegits()) tocarConfig();
  $("#tabs").innerHTML = T.map(x=>
    `<button class="${tab===x.id?"on":""}" onclick="tab='${x.id}';render()">${x.n}</button>`).join("");
  $("#wlbl").textContent = fmtDay(cursor)+" – "+fmtDay(addDays(cursor,6))+
    (weekKey(cursor)===weekKey(TODAY)?" · actual":"");
  $("#view").innerHTML = (T.find(x=>x.id===tab)||T[0]).f();
}
$("#wprev").onclick  = ()=>{ cursor = addDays(cursor,-7); render(); };
$("#wnext").onclick  = ()=>{ cursor = addDays(cursor, 7); render(); };
$("#wtoday").onclick = ()=>{ cursor = monday(TODAY); render(); };

function pintarSinc(e, canvis){
  const p = $("#estatSinc .p");
  p.className = "p"+(e.estat==="connectat" ? "" : e.estat==="error" ? " err" : " off");
  $("#estatTxt").textContent =
    e.estat==="connectat" ? "sessió iniciada"+(e.email?" · "+e.email:"") :
    e.estat==="sense-sessio" ? "sessió no iniciada" :
    e.estat==="carregant" ? "connectant…" :
    e.estat==="error" ? "sense connexió" : "només aquest aparell";
  render();
}

render();
Sync.init(pintarSinc);
</script>
